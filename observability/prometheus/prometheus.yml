global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: user-service
    static_configs:
      - targets: ["user-service:4001"]
        labels:
          service: user-service

  - job_name: order-service
    static_configs:
      - targets: ["order-service:4002"]
        labels:
          service: order-service

  - job_name: worker
    static_configs:
      - targets: ["worker:4003"]
        labels:
          service: worker

  # RabbitMQ moved to CloudAMQP, so the local broker container (and the
  # rabbitmq_prometheus plugin on :15692 that this job used to scrape) is
  # gone. The job is removed rather than left failing, because a permanently
  # down target trains you to ignore red targets - and worse, while the old
  # orphaned container was still running it reported "up" and fed the
  # Dependencies dashboard the queue depth of a broker nothing was using.
  #
  # KNOWN GAP: broker-native queue depth is currently unobservable. Restoring
  # it means scraping CloudAMQP's own metrics endpoint (their Prometheus
  # integration, or the management API via an exporter) - it cannot come from
  # the app, since depth is a property of the broker, not of any producer or
  # consumer. The app-side signals (queue_messages_published_total,
  # queue_messages_consumed_total, worker_active_jobs) are unaffected.
