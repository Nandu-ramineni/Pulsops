global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: user-service
    static_configs:
      - targets: ["user-service:4001"]
        labels:
          service: user-service

  - job_name: order-service
    static_configs:
      - targets: ["order-service:4002"]
        labels:
          service: order-service

  - job_name: worker
    static_configs:
      - targets: ["worker:4003"]
        labels:
          service: worker

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
