name: pulseops

x-database-url: &database-url postgres://${POSTGRES_USER:-pulseops}:${POSTGRES_PASSWORD:-pulseops}@postgres:5432/${POSTGRES_DB:-pulseops}

# Services export OTLP to Alloy, not straight to Tempo, so the backend can be
# swapped or sampled without redeploying any service. OTEL_SERVICE_NAME is set
# per service below and is what Tempo shows as the service in a trace.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: user-service
      PORT: 4001
      DATABASE_URL: *database-url
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order-service
      PORT: 4002
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      # Fails the compose command outright if unset, rather than letting
      # amqplib silently fall back to amqp://localhost and surface as a
      # confusing ECONNREFUSED on the first order.
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env (see .env.example)}
      USER_SERVICE_URL: http://user-service:4001
      USER_CACHE_TTL_SECONDS: 60
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

  worker:
    build: ./services/worker
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: worker
      HEALTH_PORT: 4003
      DATABASE_URL: *database-url
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env (see .env.example)}
      PREFETCH: 5
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      PORT: 8080
      USER_SERVICE_URL: http://user-service:4001
      ORDER_SERVICE_URL: http://order-service:4002
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9200:9090"

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    user: root
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API / Grafana datasource

  # Grafana Alloy reads container logs off the Docker API and pushes them to
  # Loki, and (Phase 7) receives OTLP traces from the services and forwards
  # them to Tempo. It replaces Promtail, which reached end-of-life in 2026.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    # Runs as root purely to read the Docker socket.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy's own UI - shows per-component health
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Explore requires edit permissions, and Explore is exactly how the
      # logs (Phase 6) and traces (Phase 7) workflows are driven. Without
      # this, anonymous users are silently redirected to the home page when
      # they follow an Explore link. Dashboards remain read-only because
      # they are file-provisioned.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  tempo-data:
